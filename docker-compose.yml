# Home Health Scheduler bridge (FastAPI).
#
# Usage:
#   docker compose up --build -d
#
# If Panel `server` is already up and you need container DNS
# (BRIDGE_BASE_URL=http://homehealthscheduler-api:8000):
#   docker network connect server_default homehealthscheduler-api
#
# Override via .env:
#   HHS_HOST_PORT, HHS_DB_HOST, HHS_ENGINE_BASE_URL

services:
  hhs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homehealthscheduler-api
    env_file:
      - .env
    environment:
      DB_HOST: ${HHS_DB_HOST:-host.docker.internal}
      ENGINE_BASE_URL: ${HHS_ENGINE_BASE_URL:-http://host.docker.internal:8000}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${HHS_HOST_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
