# Home Health Scheduler bridge (FastAPI).
#
# Usage:
#   docker compose up --build -d
#
# Panel reaches this container as http://homehealthscheduler-api:8000 only when
# both share a Docker network. Join Panel's compose network (default name
# server_default) via HHS_PANEL_NETWORK, or after start:
#   docker network connect server_default homehealthscheduler-api
#
# Override via .env:
#   HHS_HOST_PORT, HHS_DB_HOST, HHS_ENGINE_BASE_URL, HHS_PANEL_NETWORK

services:
  hhs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homehealthscheduler-api
    env_file:
      - .env
    environment:
      DB_HOST: ${HHS_DB_HOST:-host.docker.internal}
      ENGINE_BASE_URL: ${HHS_ENGINE_BASE_URL:-http://34.244.104.57/api-engine}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${HHS_HOST_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - panel
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  panel:
    external: true
    name: ${HHS_PANEL_NETWORK:-server_default}
