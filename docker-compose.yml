# Home Health Scheduler bridge (FastAPI).
# Expects existing host services:
#   - PostgreSQL (Panel DB) on DB_PORT from .env (e.g. 6969)
#   - engine-service scheduler-api on host :8000
#
# Usage:
#   docker compose up --build -d
#
# Bridge listens on host :8001 (scheduler-api already owns :8000).

services:
  hhs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homehealthscheduler-api
    env_file:
      - .env
    environment:
      # .env uses localhost; rewrite for container → host
      DB_HOST: host.docker.internal
      ENGINE_BASE_URL: http://host.docker.internal:8000
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${HHS_HOST_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
